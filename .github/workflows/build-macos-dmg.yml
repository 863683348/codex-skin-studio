name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: |
          cd engine/macos
          bash scripts/build-dmg.sh --skip-tests 2>&1 | tee build.log || true
          tail -60 build.log
        env:
          LC_ALL: C
          LANG: C

      - name: List artifacts
        run: ls -la engine/macos/release/ || true

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: engine/macos/build.log
          if-no-files-found: ignore

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSkinStudio-macOS
          path: engine/macos/release/*.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release (auto)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v1.0.0
          name: Codex Skin Studio macOS v1.0.0
          body: |
            macOS 安装包（GitHub Actions 云构建）。

            注意：当前为未签名构建，首次运行需右键 → 打开。
          files: engine/macos/release/*.dmg
          draft: false
          prerelease: true
