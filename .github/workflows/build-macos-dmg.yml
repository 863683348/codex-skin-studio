name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        id: build
        run: |
          cd engine/macos
          set +e
          bash scripts/build-dmg.sh --skip-tests 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code"
          exit $code
        env:
          LC_ALL: C
          LANG: C

      - name: Report failure to issue
        if: failure() || steps.build.outcome == 'failure'
        run: |
          if [ -f engine/macos/build.log ]; then
            LOG=$(tail -80 engine/macos/build.log)
            gh issue create --title "macOS DMG build failed" --body "Build log:
            \`\`\`text
            $LOG
            \`\`\`" || true
          else
            gh issue create --title "macOS DMG build failed" --body "no build.log produced" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload DMG artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodexSkinStudio-macOS
          path: engine/macos/release/*.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release (auto)
        if: success() && startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v1.0.0
          name: Codex Skin Studio macOS v1.0.0
          body: |
            macOS 安装包（GitHub Actions 云构建）。

            注意：当前为未签名构建，首次运行需右键 → 打开。
          files: engine/macos/release/*.dmg
          draft: false
          prerelease: true
